services:
  postgres:
    image: postgres:16
    # Read from .env; stop with an error if a value is missing or empty.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Local address : Windows port : container port
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Keep database files in a named volume when the container is removed.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ lets the container shell read its own environment variables.
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
